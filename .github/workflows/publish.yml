name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag or branch) to publish
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.ref || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name || github.ref }}

      - name: Verify tag matches library version
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          TAG="${TAG#v}"
          VERSION="$(grep '^library.version=' gradle.properties | cut -d= -f2)"
          echo "Tag: $TAG, library.version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match library.version '$VERSION'"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace --console=plain
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
