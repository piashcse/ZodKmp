name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: true
      release_title:
        description: 'Release title'
        required: true
        default: 'Release'
      release_body:
        description: 'Release notes (leave empty to auto-generate)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and create GitHub release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version in gradle.properties
        run: |
          sed -i "s/^library.version=.*/library.version=${{ github.event.inputs.version }}/" gradle.properties
          grep '^library.version=' gradle.properties

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit version and create tag
        id: tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          git add gradle.properties
          if git diff --cached --quiet; then
            echo "Version already at $TAG; no version commit needed."
          else
            git commit -m "chore: release $TAG"
          fi
          git tag "$TAG"
          git push origin HEAD:main --tags
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ github.event.inputs.release_title }}
          BODY: ${{ github.event.inputs.release_body }}
        run: |
          if [ -n "$BODY" ]; then
            gh release create "$TAG" --title "$TITLE $TAG" --notes "$BODY"
          else
            gh release create "$TAG" --title "$TITLE $TAG" --generate-notes
          fi

  publish:
    name: Publish release to Maven Central
    needs: release
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace --console=plain
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
