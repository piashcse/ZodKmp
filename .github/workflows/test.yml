name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: Test (macOS - desktop, JS, Wasm, iOS)
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Run desktop, JS, Wasm and iOS tests
        run: |
          ./gradlew :zodkmp:desktopTest :zodkmp:jsNodeTest :zodkmp:wasmJsBrowserTest :zodkmp:iosSimulatorArm64Test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: |
            zodkmp/build/reports/tests/**
            zodkmp/build/test-results/**

  test-linux:
    name: Test (Linux - desktop, Linux Native x64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Run desktop and Linux Native x64 tests
        run: |
          ./gradlew :zodkmp:desktopTest :zodkmp:linuxX64Test --console=plain

      - name: Cross-compile Linux arm64 (compile check)
        run: |
          ./gradlew :zodkmp:compileKotlinLinuxArm64 --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: |
            zodkmp/build/reports/tests/**
            zodkmp/build/test-results/**
