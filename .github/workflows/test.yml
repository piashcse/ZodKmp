name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (macOS - desktop, JS, Wasm, iOS, API)
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and API check
        run: |
          ./gradlew \
            :zodkmp:desktopTest \
            :zodkmp:jsNodeTest \
            :zodkmp:wasmJsBrowserTest \
            :zodkmp:iosSimulatorArm64Test \
            :zodkmp:apiCheck \
            --stacktrace --console=plain

      - name: Compile remaining Apple targets
        run: |
          ./gradlew \
            :zodkmp:compileKotlinIosArm64 \
            :zodkmp:compileKotlinMacosArm64 \
            :zodkmp:compileKotlinMacosX64 \
            --stacktrace --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: |
            zodkmp/build/reports/tests/**
            zodkmp/build/test-results/**
            zodkmp/build/reports/kover/**

  test-linux:
    name: Test (Linux - desktop, Linux Native, publish smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, coverage and API check
        run: |
          ./gradlew \
            :zodkmp:desktopTest \
            :zodkmp:linuxX64Test \
            :zodkmp:koverHtmlReport \
            :zodkmp:apiCheck \
            :zodkmp:ktlintCheck \
            :zodkmp-ksp:ktlintCheck \
            :codegen-test:test \
            --stacktrace --console=plain

      - name: Compile remaining native targets
        run: |
          ./gradlew \
            :zodkmp:compileKotlinLinuxArm64 \
            :zodkmp:compileKotlinMingwX64 \
            --stacktrace --console=plain

      - name: Publish to Maven Local (smoke test)
        run: ./gradlew :zodkmp:publishToMavenLocal -PsignAllPublications=false -PmavenCentralPublishing=false --stacktrace --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: |
            zodkmp/build/reports/tests/**
            zodkmp/build/test-results/**
            zodkmp/build/reports/kover/**
