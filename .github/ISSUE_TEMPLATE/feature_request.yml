name: Feature request
description: Suggest an API or behaviour improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: kotlin
  - type: input
    id: zod
    attributes:
      label: Equivalent Zod API (if any)
